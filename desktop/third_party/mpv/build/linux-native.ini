[binaries]
c = '/opt/llvm/bin/clang'
cpp = '/opt/llvm/bin/clang++'
cmake = '/usr/bin/cmake'
ninja = '/usr/bin/ninja'
python = '/usr/bin/python3'
pkg-config = '/work/native/bin/pkg-config'

[built-in options]
c_args = ['-ffile-prefix-map=/work=/usr/src/autolive-mpv']
cpp_args = ['-ffile-prefix-map=/work=/usr/src/autolive-mpv']
