[binaries]
c = '/opt/llvm/bin/clang-cl'
cpp = '/opt/llvm/bin/clang-cl'
c_ld = 'lld-link'
cpp_ld = 'lld-link'
ar = '/work/native/bin/llvm-lib'
strip = '/work/native/bin/llvm-strip'
windres = '/work/native/bin/llvm-rc'
cmake = '/usr/bin/cmake'
pkg-config = '/work/native/bin/pkg-config'

[built-in options]
c_args = ['--target=x86_64-pc-windows-msvc', '-fuse-ld=lld-link', '/MT', '/Brepro', '/clang:-ffile-prefix-map=/work=/usr/src/autolive-mpv', '/imsvc/work/sysroot/msvc/include', '/imsvc/work/sysroot/ucrt/include', '/imsvc/work/sysroot/windows-sdk/include/shared', '/imsvc/work/sysroot/windows-sdk/include/um', '/imsvc/work/sysroot/windows-sdk/include/winrt']
cpp_args = ['--target=x86_64-pc-windows-msvc', '-fuse-ld=lld-link', '/MT', '/Brepro', '/clang:-ffile-prefix-map=/work=/usr/src/autolive-mpv', '/imsvc/work/sysroot/msvc/include', '/imsvc/work/sysroot/ucrt/include', '/imsvc/work/sysroot/windows-sdk/include/shared', '/imsvc/work/sysroot/windows-sdk/include/um', '/imsvc/work/sysroot/windows-sdk/include/winrt']
c_link_args = ['/Brepro', '/subsystem:console', '/libpath:/work/sysroot/msvc/lib/x64', '/libpath:/work/sysroot/ucrt/lib/x64', '/libpath:/work/sysroot/windows-sdk/lib/um/x64']
cpp_link_args = ['/Brepro', '/subsystem:console', '/libpath:/work/sysroot/msvc/lib/x64', '/libpath:/work/sysroot/ucrt/lib/x64', '/libpath:/work/sysroot/windows-sdk/lib/um/x64']
b_vscrt = 'mt'

[properties]
needs_exe_wrapper = true
pkg_config_libdir = '/work/prefix/lib/pkgconfig'
cmake_toolchain_file = '/recipe/x86_64-pc-windows-msvc.cmake'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
