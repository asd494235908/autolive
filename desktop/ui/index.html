<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GpAutoLive</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0b0b0f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      html,
      body,
      #root {
        width: 100%;
        min-width: 320px;
        min-height: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: #f7f7f8;
        background: #0b0b0f;
      }

      #startup-splash {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        color: #f7f7f8;
        background: #0b0b0f;
      }

      .startup-splash-content {
        display: grid;
        justify-items: center;
        gap: 14px;
        padding: 32px;
      }

      .startup-splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(247, 247, 248, 0.14);
        border-top-color: #31d7aa;
        border-radius: 50%;
        animation: startup-splash-spin 0.9s linear infinite;
      }

      .startup-splash-title {
        font-size: 16px;
        font-weight: 600;
      }

      .startup-splash-message {
        color: #9a9aa3;
        font-size: 13px;
      }

      @keyframes startup-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup-splash" role="status" aria-live="polite">
        <div class="startup-splash-content">
          <div class="startup-splash-spinner" aria-hidden="true"></div>
          <div class="startup-splash-title">GpAutoLive</div>
          <div class="startup-splash-message">正在启动桌面端…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
