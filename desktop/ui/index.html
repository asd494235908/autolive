<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>autolive-desktop-core</title>
    <style>
      :root {
        color-scheme: light;
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      html,
      body,
      #root {
        width: 100%;
        min-width: 320px;
        min-height: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow-x: hidden;
        overflow-y: auto;
        background: #fff;
      }

      #startup-splash {
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        color: rgba(0, 0, 0, 0.88);
        background: #fff;
      }

      .startup-splash-content {
        display: grid;
        justify-items: center;
        gap: 14px;
        padding: 32px;
      }

      .startup-splash-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(0, 0, 0, 0.06);
        border-top-color: #1677ff;
        border-radius: 50%;
        animation: startup-splash-spin 0.9s linear infinite;
      }

      .startup-splash-title {
        font-size: 16px;
        font-weight: 600;
      }

      .startup-splash-message {
        color: rgba(0, 0, 0, 0.65);
        font-size: 13px;
      }

      @keyframes startup-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="startup-splash" role="status" aria-live="polite">
        <div class="startup-splash-content">
          <div class="startup-splash-spinner" aria-hidden="true"></div>
          <div class="startup-splash-title">autolive-desktop-core</div>
          <div class="startup-splash-message">正在启动桌面端…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
