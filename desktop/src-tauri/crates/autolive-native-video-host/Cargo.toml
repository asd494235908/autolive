[package]
name = "autolive-native-video-host"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Dedicated Win32 child-window host for the managed mpv video surface."

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# Win32 unsafe 只允许存在于此封装 crate；桌面主 crate 继续 forbid。
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
