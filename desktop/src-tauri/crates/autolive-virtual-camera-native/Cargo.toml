[package]
name = "autolive-virtual-camera-native"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Fail-closed Windows Graphics Capture, D3D11 and AkVirtualCamera prerequisite probe."

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_SystemInformation",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
# 所有 WinRT/D3D11/Win32 FFI 仅允许在本 crate 的 platform 模块中出现。
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
