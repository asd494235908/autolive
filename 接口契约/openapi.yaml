          schema:
            $ref: '#/components/schemas/Timestamp'
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at_desc, created_at_asc]
      responses:
        '200':
          description: 审计日志分页列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/health:
    get:
      tags: [Admin]
      summary: 健康检查
      operationId: health
      responses:
        '200':
          description: 服务健康状态
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/livez:
    get:
      tags: [Admin]
      summary: 存活检查
      operationId: livez
      responses:
        '200':
          description: 进程存活
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/readyz:
    get:
      tags: [Admin]
      summary: 就绪检查
      operationId: readyz
      responses:
        '200':
          description: 服务已准备好接收流量
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: 依赖未就绪
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
  headers:
    X-Request-Id:
      description: 客户端提供合法值时服务端校验后透传；缺失或非法时由服务端生成请求追踪 ID
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        写接口必填。相同认证主体、相同资源语义和相同幂等键的重复请求必须返回同一结果，不能重复产生副作用。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    LeaseId:
      name: lease_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  responses:
    BadRequest:
      description: 请求参数不合法
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_argument:
              summary: 参数校验失败
              value:
                code: INVALID_ARGUMENT
                message: 请求参数不合法
                request_id: req_contract_bad_request
    Unauthorized:
      description: 未登录或会话失效
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthenticated:
              summary: 会话无效
              value:
                code: UNAUTHENTICATED
                message: 未提供有效 Bearer Token
                request_id: req_contract_unauthenticated
    Forbidden:
      description: 已登录但无权限或资源不可用
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: 无权限
              value:
                code: FORBIDDEN
                message: 没有访问该资源的权限
                request_id: req_contract_forbidden
    NotFound:
      description: 资源不存在
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              summary: 资源不存在
              value:
                code: NOT_FOUND
                message: 请求的资源不存在
                request_id: req_contract_not_found
    Conflict:
      description: 状态冲突或重复请求语义不一致
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conflict:
              summary: 状态冲突
              value:
                code: IDEMPOTENCY_CONFLICT
                message: 幂等键对应的请求语义冲突
                request_id: req_contract_conflict
    TooManyRequests:
      description: 达到限流或并发上限
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          description: 建议客户端等待的秒数
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limited:
              summary: 请求频率超限
              value:
                code: RATE_LIMITED
                message: 请求过于频繁，请稍后重试
                request_id: req_contract_rate_limited
    BadGateway:
      description: 上游模型供应商返回失败或无效响应
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            bad_gateway:
              summary: 上游响应无效
              value:
                code: MODEL_POOL_SECRET_VALIDATION_FAILED
                message: 新模型密钥连通性校验失败
                request_id: req_contract_bad_gateway
    ServiceUnavailable:
      description: 模型账号、直连租约、提交结果核对或供应商暂时不可用
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            service_unavailable:
              summary: 服务暂不可用
              value:
                code: AUTH_SESSION_STORE_UNAVAILABLE
                message: 会话存储暂不可用
                request_id: req_contract_unavailable
    GatewayTimeout:
      description: 上游模型请求超时
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            gateway_timeout:
              summary: 请求超时
              value:
                code: REQUEST_TIMEOUT
                message: 请求处理超时
                request_id: req_contract_gateway_timeout
    MethodNotAllowed:
      description: 当前路由不支持该请求方法
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            method_not_allowed:
              summary: 方法不支持
              value:
                code: METHOD_NOT_ALLOWED
                message: 请求方法不被允许
                request_id: req_contract_method_not_allowed
    RequestTimeout:
      description: 请求在服务端完成前被取消
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            request_canceled:
              summary: 请求已取消
              value:
                code: REQUEST_CANCELED
                message: 请求已取消
                request_id: req_contract_request_canceled
    InternalServerError:
      description: 未分类服务端异常
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal_error:
              summary: 服务内部错误
              value:
                code: INTERNAL_ERROR
                message: 服务内部错误
                request_id: req_contract_internal_error
  schemas:
    Id:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{7,63}$'
    Timestamp:
      type: string
      format: date-time
    Sha256Hex:
      type: string
      pattern: '^[a-f0-9]{64}$'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: 稳定错误码，供三端分支处理；审计持久化失败时返回 AUDIT_UNAVAILABLE（HTTP 503）并不会提交原业务响应
        message:
          type: string
          description: 面向操作者的可读消息
        request_id:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
    ActorRole:
      type: string
      enum: [admin, user]
    UserStatus:
      type: string
      enum: [active, disabled]
    DeviceStatus:
      type: string
      enum: [pending_activation, active, disabled, revoked]
    ActivationCodeStatus:
      type: string
      enum: [active, used, expired, revoked]
    ModelAccountStatus:
      type: string
      enum: [active, cooldown, exhausted, disabled]
    ModelLeaseStatus:
      type: string
      enum: [active, released, expired]
    SessionTokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, expires_at]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          $ref: '#/components/schemas/Timestamp'
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, username, role, status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          minLength: 3
          maxLength: 64
        role:
          $ref: '#/components/schemas/ActorRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    UserAuthorizationSummary:
      type: object
      additionalProperties: false
      required: [user_id, device_count, active_device_count, active_lease_count, active_account_count, daily_used_tokens, usage_source, hard_quota_configured, allowed_models, daily_token_limit, quota_enforcement, as_of]
      properties:
        user_id:
          $ref: '#/components/schemas/Id'
        device_count:
          type: integer
          minimum: 0
        active_device_count:
          type: integer
          minimum: 0
        active_lease_count:
          type: integer
          minimum: 0
        active_account_count:
          type: integer
          minimum: 0
        daily_used_tokens:
          type: integer
          minimum: 0
        usage_source:
          type: string
          enum: [client_reported_soft]
          description: 客户端事后上报的软额度依据，不是供应商权威账单
        hard_quota_configured:
          type: boolean
          description: 当前版本不提供用户级供应商硬额度，固定为 false
        allowed_models:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: '^[^/]{1,64}/[^/]{1,128}$'
          description: provider/model allowlist；空数组表示允许所有已登记模型
        daily_token_limit:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: 服务端已接收用量门禁；0 表示未配置
        quota_enforcement:
          type: string
          enum: [server_recorded_usage_guard]
          description: 说明额度只基于服务端已接收记录，不代表供应商权威账单
        as_of:
          $ref: '#/components/schemas/Timestamp'
    DeviceSummary:
      type: object
      additionalProperties: false
      required: [id, user_id, device_name, platform, app_version, status, online, last_seen_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        user_id:
          $ref: '#/components/schemas/Id'
        device_name:
          type: string
          maxLength: 128
        platform:
          type: string
          maxLength: 64
        app_version:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/DeviceStatus'
        online:
          type: boolean
          description: 服务端依据最后心跳和固定阈值派生的在线状态
        disk_free_bytes:
          type: integer
          minimum: 0
        memory_total_bytes:
          type: integer
          minimum: 0
        memory_available_bytes:
          type: integer
          minimum: 0
        cpu_logical_cores:
          type: integer
          minimum: 0
          maximum: 4096
        runtime_os_name:
          type: string
          maxLength: 128
        runtime_os_version:
          type: string
          maxLength: 128
        kernel_version:
          type: string
          maxLength: 128
        current_media_name:
          type: string
          maxLength: 255
        playback_state:
          type: string
          enum: [idle, playing, paused, error]
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 256
    LoginResponse:
      type: object
      additionalProperties: false
      required: [request_id, tokens, user]
      properties:
        request_id:
          type: string
        tokens:
          $ref: '#/components/schemas/SessionTokens'
        user:
          $ref: '#/components/schemas/UserSummary'
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    RefreshTokenResponse:
      type: object
      additionalProperties: false
      required: [request_id, tokens]
      properties:
        request_id:
          type: string
        tokens:
          $ref: '#/components/schemas/SessionTokens'
    LogoutRequest:
      type: object
      additionalProperties: false
      description: 可选 refresh_token 仅为兼容客户端请求体；服务端只撤销当前 Bearer Token 对应会话，不会撤销其他会话。
      properties:
        refresh_token:
          type: string
    LogoutResponse:
      type: object
      additionalProperties: false
      required: [request_id, success]
      properties:
        request_id:
          type: string
        success:
          type: boolean
          const: true
    ActivateDeviceRequest:
      type: object
      additionalProperties: false
      required: [activation_code, device]
      properties:
        activation_code:
          type: string
          minLength: 8
          maxLength: 128
        device:
          $ref: '#/components/schemas/DeviceRegistration'
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [device_id, device_name, platform, app_version]
      properties:
        device_id:
          $ref: '#/components/schemas/Id'
        device_name:
          type: string
          maxLength: 128
        platform:
          type: string
          maxLength: 64
        app_version:
          type: string
          maxLength: 64
        os_version:
          type: string
          maxLength: 128
    ActivateDeviceResponse:
      type: object
      additionalProperties: false
      required: [request_id, device]
      properties:
        request_id:
          type: string
        device:
          $ref: '#/components/schemas/DeviceSummary'
    HeartbeatRequest:
      type: object
      additionalProperties: false
      required: [device_id, sent_at, status]
      properties:
        device_id:
          $ref: '#/components/schemas/Id'
        sent_at:
          $ref: '#/components/schemas/Timestamp'
        status:
          type: object
          additionalProperties: false
          required: [disk_free_bytes]
          properties:
            disk_free_bytes:
              type: integer
              minimum: 0
            memory_total_bytes:
              type: integer
              minimum: 0
            memory_available_bytes:
              type: integer
              minimum: 0
            cpu_logical_cores:
              type: integer
              minimum: 0
              maximum: 4096
            os_name:
              type: string
              maxLength: 128
            os_version:
              type: string
              maxLength: 128
            kernel_version:
              type: string
              maxLength: 128
            current_media_name:
              type: string
              maxLength: 255
            playback_state:
              type: string
              enum: [idle, playing, paused, error]
    HeartbeatResponse:
      type: object
      additionalProperties: false
      required: [request_id, accepted_at, device_status]
      properties:
        request_id:
          type: string
        accepted_at:
          $ref: '#/components/schemas/Timestamp'
        device_status:
          $ref: '#/components/schemas/DeviceStatus'
    ClientProfileResponse:
      type: object
      additionalProperties: false
      required: [request_id, user, device, permissions]
      properties:
        request_id:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
        device:
          $ref: '#/components/schemas/DeviceSummary'
        permissions:
          type: array
          items:
            type: string
    CreateModelPoolAccountRequest:
      type: object
      additionalProperties: false
      required: [provider, model, api_key, priority, daily_limit, concurrency_limit]
      properties:
        provider:
          type: string
          maxLength: 64
        model:
          type: string
          maxLength: 128
        base_url:
          type: string
          format: uri
          description: OpenAI-compatible API 根地址，仅允许 http/https；不得包含密钥
        api_key:
          type: string
          minLength: 8
          maxLength: 4096
          writeOnly: true
        priority:
          type: integer
        daily_limit:
          type: integer
          minimum: 0
        concurrency_limit:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ModelAccountStatus'
          description: 初始状态；默认 active，disabled 仍受活动租约规则约束
    UpdateModelPoolAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        base_url:
          type: string
          format: uri
          description: OpenAI-compatible API 根地址；不得包含密钥
        priority:
          type: integer
          minimum: 0
        daily_limit:
          type: integer
          minimum: 0
        concurrency_limit:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ModelAccountStatus'
    TestModelPoolAccountRequest:
      type: object
      additionalProperties: false
      properties:
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 60
          default: 15
    RotateModelPoolAccountSecretRequest:
      type: object
      additionalProperties: false
      required: [api_key]
      properties:
        api_key:
          type: string
          minLength: 8
          maxLength: 4096
          writeOnly: true
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 60
          default: 15
    ModelPoolConnectivityTestResponse:
      type: object
      additionalProperties: false
      required: [request_id, account_id, provider, model, status, tested_at, latency_ms]
      properties:
        request_id:
          type: string
        account_id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum: [succeeded, failed, timeout]
        tested_at:
          $ref: '#/components/schemas/Timestamp'
        latency_ms:
          type: integer
          minimum: 0
        http_status:
          type: integer
          minimum: 100
          maximum: 599
        provider:
          type: string
        model:
          type: string
        response_summary:
          type: string
          maxLength: 512
        error_code:
          type: string
          maxLength: 128
          description: "模型连通性失败原因；明文 HTTP 未显式允许时为 MODEL_POOL_CONNECTIVITY_INSECURE_HTTP"
    CreateModelLeaseRequest:
      type: object
      additionalProperties: false
      required: [provider, model, purpose]
      properties:
        provider:
          type: string
          maxLength: 64
        model:
          type: string
          maxLength: 128
        purpose:
          type: string
          enum: [realtime_script, chat, validation]
        max_duration_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 300
    RenewModelLeaseRequest:
      type: object
      additionalProperties: false
      properties:
        extend_seconds:
          type: integer
          minimum: 30
          maximum: 3600
          default: 300
    ReleaseModelLeaseRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 255
    ModelLeaseResponse:
      type: object
      additionalProperties: false
      required: [request_id, lease]
      properties:
        request_id:
          type: string
        lease:
          $ref: '#/components/schemas/ModelLease'
    ModelLease:
      type: object
      additionalProperties: false
      required:
        [id, provider, model, status, expires_at, proxy_mode, concurrency_limit]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        provider:
          type: string
        model:
          type: string
        status:
          $ref: '#/components/schemas/ModelLeaseStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        released_at:
          $ref: '#/components/schemas/Timestamp'
        proxy_mode:
          type: string
          enum: [direct_lease]
        concurrency_limit:
          type: integer
          minimum: 1
        direct_base_url:
          type: string
          format: uri
          readOnly: true
          description: 当前租约允许访问的 OpenAI-compatible API 根地址；不得由客户端修改
    ModelLeaseAdminSummary:
      type: object
      additionalProperties: false
      required: [id, account_id, user_id, device_id, purpose, provider, model, status, expires_at, proxy_mode, concurrency_limit]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        account_id:
          $ref: '#/components/schemas/Id'
        user_id:
          $ref: '#/components/schemas/Id'
        device_id:
          $ref: '#/components/schemas/Id'
