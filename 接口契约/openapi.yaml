    ActivationCodeEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, activation_code]
      properties:
        request_id:
          type: string
        activation_code:
          $ref: '#/components/schemas/ActivationCode'
    ActivationCodeListResponse:
      type: object
      additionalProperties: false
      required: [request_id, items, pagination]
      properties:
        request_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivationCode'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ModelPoolAccountEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, account]
      properties:
        request_id:
          type: string
        account:
          $ref: '#/components/schemas/ModelPoolAccountSummary'
    ModelPoolAccountSummary:
      type: object
      additionalProperties: false
