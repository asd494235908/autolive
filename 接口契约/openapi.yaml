      properties:
        id:
          $ref: '#/components/schemas/Id'
        provider:
          type: string
        model:
          type: string
        base_url:
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/ModelAccountStatus'
        priority:
          type: integer
        daily_limit:
          type: integer
        concurrency_limit:
          type: integer
        secret_configured:
          type: boolean
        active_leases:
          type: integer
          minimum: 0
        daily_used_tokens:
          type: integer
          minimum: 0
        last_test_status:
          type: string
          enum: [succeeded, failed, timeout]
        last_tested_at:
          $ref: '#/components/schemas/Timestamp'
    ModelPoolResponse:
      type: object
      additionalProperties: false
      required: [request_id, accounts]
      properties:
        request_id:
          type: string
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/ModelPoolAccountSummary'
    ModelUsageRecord:
