components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: 不透明 Access Token；`/api/v1/admin/**` 受保护路由只接受 `audience=admin`，桌面专用 `/api/v1/client/**` 受保护路由只接受 `audience=desktop`，错配返回 `403 AUTH_SESSION_AUDIENCE_MISMATCH`
  headers:
    X-Request-Id:
      description: 客户端提供合法值时服务端校验后透传；缺失或非法时由服务端生成请求追踪 ID
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]+$'
  parameters:
    LegacyClientCompatibilityHeader:
      name: X-Client-Compatibility
      in: header
      required: false
      description: 缺省 product 时仅允许取值 `legacy`，此时映射为 `autolive`；普通缺省登录请求返回 400，不从 User-Agent、版本、query 或其他 header 推断产品。
      schema:
        type: string
        enum: [legacy]
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        写接口必填。相同认证主体、相同资源语义和相同幂等键的重复请求必须返回同一结果，不能重复产生副作用。
      schema:
        type: string
        minLength: 8
        maxLength: 128
    LeaseId:
      name: lease_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    AdminProduct:
      name: product
      in: query
      description: 内建跨产品管理员省略时查询全部产品；其他管理员仅可查询认证会话所属产品。
      schema:
        $ref: '#/components/schemas/ProductCode'
  responses:
    BadRequest:
      description: 请求参数不合法
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_argument:
              summary: 参数校验失败
              value:
                code: INVALID_ARGUMENT
                message: 请求参数不合法
                request_id: req_contract_bad_request
    Unauthorized:
      description: 未登录或会话失效
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthenticated:
              summary: 会话无效
              value:
                code: UNAUTHENTICATED
                message: 未提供有效 Bearer Token
                request_id: req_contract_unauthenticated
    Forbidden:
      description: 已登录但无权限或资源不可用
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              summary: 无权限
              value:
                code: FORBIDDEN
                message: 没有访问该资源的权限
                request_id: req_contract_forbidden
    NotFound:
      description: 资源不存在
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            not_found:
              summary: 资源不存在
              value:
                code: NOT_FOUND
                message: 请求的资源不存在
                request_id: req_contract_not_found
    Conflict:
      description: 状态冲突或重复请求语义不一致
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conflict:
              summary: 状态冲突
              value:
                code: IDEMPOTENCY_CONFLICT
                message: 幂等键对应的请求语义冲突
                request_id: req_contract_conflict
    TooManyRequests:
      description: 达到限流或并发上限
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          description: 建议客户端等待的秒数
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limited:
              summary: 请求频率超限
              value:
                code: RATE_LIMITED
                message: 请求过于频繁，请稍后重试
                request_id: req_contract_rate_limited
    BadGateway:
      description: 上游模型供应商返回失败或无效响应
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            bad_gateway:
              summary: 上游响应无效
              value:
                code: MODEL_POOL_SECRET_VALIDATION_FAILED
                message: 新模型密钥连通性校验失败
                request_id: req_contract_bad_gateway
    ServiceUnavailable:
      description: 模型账号、直连租约、提交结果核对或供应商暂时不可用
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            service_unavailable:
              summary: 服务暂不可用
              value:
                code: AUTH_SESSION_STORE_UNAVAILABLE
                message: 会话存储暂不可用
                request_id: req_contract_unavailable
            admin_authorization_unavailable:
              summary: 管理员权限快照暂不可用
              value:
                code: ADMIN_AUTHORIZATION_UNAVAILABLE
                message: 管理员权限暂时无法读取
                request_id: req_contract_admin_authorization_unavailable
    GatewayTimeout:
      description: 上游模型请求超时
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            gateway_timeout:
              summary: 请求超时
              value:
                code: REQUEST_TIMEOUT
                message: 请求处理超时
                request_id: req_contract_gateway_timeout
    MethodNotAllowed:
      description: 当前路由不支持该请求方法
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            method_not_allowed:
              summary: 方法不支持
              value:
                code: METHOD_NOT_ALLOWED
                message: 请求方法不被允许
                request_id: req_contract_method_not_allowed
    RequestTimeout:
      description: 请求在服务端完成前被取消
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            request_canceled:
              summary: 请求已取消
              value:
                code: REQUEST_CANCELED
                message: 请求已取消
                request_id: req_contract_request_canceled
    InternalServerError:
      description: 未分类服务端异常
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internal_error:
              summary: 服务内部错误
              value:
                code: INTERNAL_ERROR
                message: 服务内部错误
                request_id: req_contract_internal_error
  schemas:
    Id:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{7,63}$'
    Timestamp:
      type: string
      format: date-time
    Sha256Hex:
      type: string
      pattern: '^[a-f0-9]{64}$'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          description: 稳定错误码，供三端分支处理；审计持久化失败时返回 AUDIT_UNAVAILABLE（HTTP 503）并不会提交原业务响应
        message:
          type: string
          description: 面向操作者的可读消息
        request_id:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
    ActorRole:
      type: string
      enum: [admin, user]
    SessionAudience:
      type: string
      enum: [admin, desktop]
      description: 会话的固定权限面；刷新不得改变该值
    ProductCode:
      type: string
      enum: [autolive, douyin_desktop]
    UserStatus:
      type: string
      enum: [active, disabled]
    DeviceStatus:
      type: string
      enum: [pending_activation, active, disabled, revoked]
    ActivationCodeStatus:
      type: string
      enum: [active, used, expired, revoked]
    ModelAccountStatus:
      type: string
      enum: [active, cooldown, exhausted, disabled]
    ModelLeaseStatus:
      type: string
      enum: [active, released, expired]
    SessionTokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, expires_at, audience]
      properties:
        access_token:
          type: string
          description: 随机不透明 Access Token，有效期固定为 15 分钟
        refresh_token:
          type: string
          description: 仅返回给直接调用认证 API 的受信边界；有效期固定为 30 天且每次刷新轮换。桌面 Rust 边界必须在返回 WebView 前移除该字段并存入系统 Keychain/Credential Manager
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        audience:
          $ref: '#/components/schemas/SessionAudience'
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, username, role, status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          minLength: 3
          maxLength: 64
        role:
          $ref: '#/components/schemas/ActorRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    AdminPermissionCode:
      type: string
      enum: [dashboard.read, users.read, users.manage, roles.read, roles.manage, roles.assign, admin_security.manage, devices.read, devices.manage, activation_codes.read, activation_codes.manage, activation_codes.reveal, activation_codes.switch_device, plans.read, plans.manage, plans.publish, orders.read, orders.reconcile, subscriptions.read, subscriptions.adjust, payments.read, payments.reconcile, password_resets.read, password_resets.retry, artifacts.read, artifacts.manage, artifacts.publish, artifacts.revoke, public_config.read, public_config.manage, public_config.publish, public_config.rollback, error_reports.read, error_reports.manage, feedback.read, feedback.manage, model_pool.read, model_pool.manage, model_pool.test, model_pool.rotate_secret, model_leases.read, model_leases.reclaim, model_usage.read, audit_logs.read, operations.read, operations.manage]
    AdminMeResponse:
      type: object
      additionalProperties: false
      required: [request_id, user, product, global_super_admin, role_codes, permissions]
      properties:
        request_id:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
        product:
          $ref: '#/components/schemas/ProductCode'
        global_super_admin:
          type: boolean
        role_codes:
          type: array
          maxItems: 200
          items:
            type: string
            maxLength: 128
        permissions:
          type: array
          maxItems: 46
          items:
            $ref: '#/components/schemas/AdminPermissionCode'
    AdminPermissionsResponse:
      type: object
      additionalProperties: false
      required: [request_id, permissions]
      properties:
        request_id:
          type: string
        permissions:
          type: array
          maxItems: 46
          items:
            $ref: '#/components/schemas/AdminPermissionCode'
    AdminRole:
      type: object
      additionalProperties: false
      required: [code, product, name, built_in, permissions]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        product:
          type:
            - string
            - 'null'
          enum: [autolive, douyin_desktop, null]
        name:
          type: string
          minLength: 1
          maxLength: 128
        built_in:
          type: boolean
        permissions:
          type: array
          maxItems: 46
          items:
            $ref: '#/components/schemas/AdminPermissionCode'
    AdminRoleEnvelope:
      type: object
      additionalProperties: false
      required: [request_id, role]
      properties:
        request_id:
          type: string
        role:
          $ref: '#/components/schemas/AdminRole'
    AdminRoleListResponse:
      type: object
      additionalProperties: false
      required: [request_id, roles]
      properties:
        request_id:
          type: string
        roles:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AdminRole'
    AdminRoleCreateRequest:
      type: object
      additionalProperties: false
      required: [code, product, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        product:
          $ref: '#/components/schemas/ProductCode'
        name:
          type: string
          minLength: 1
          maxLength: 128
        permissions:
          type: array
          maxItems: 46
          items:
            $ref: '#/components/schemas/AdminPermissionCode'
    AdminRoleUpdateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        product:
          $ref: '#/components/schemas/ProductCode'
        name:
          type: string
          minLength: 1
          maxLength: 128
        permissions:
          type: array
          maxItems: 46
          items:
            $ref: '#/components/schemas/AdminPermissionCode'
    AdminRoleAssignment:
      type: object
      additionalProperties: false
      required: [user_id, role_code, product]
      properties:
        user_id:
          $ref: '#/components/schemas/Id'
        role_code:
          type: string
          minLength: 1
          maxLength: 128
        product:
          $ref: '#/components/schemas/ProductCode'
    ReplaceUserAdminRolesRequest:
      type: object
      additionalProperties: false
      required: [product, role_codes]
      properties:
        product:
          $ref: '#/components/schemas/ProductCode'
        role_codes:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 128
    UserAdminRolesResponse:
      type: object
      additionalProperties: false
      required: [request_id, assignments]
      properties:
        request_id:
          type: string
        assignments:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AdminRoleAssignment'
    UserAuthorizationSummary:
      type: object
      additionalProperties: false
      required: [user_id, device_count, active_device_count, active_lease_count, active_account_count, daily_used_tokens, usage_source, hard_quota_configured, allowed_models, daily_token_limit, quota_enforcement, as_of]
      properties:
        user_id:
          $ref: '#/components/schemas/Id'
        device_count:
          type: integer
          minimum: 0
        active_device_count:
          type: integer
          minimum: 0
        active_lease_count:
          type: integer
          minimum: 0
        active_account_count:
          type: integer
          minimum: 0
        daily_used_tokens:
          type: integer
          minimum: 0
        usage_source:
          type: string
          enum: [client_reported_soft]
          description: 客户端事后上报的软额度依据，不是供应商权威账单
        hard_quota_configured:
          type: boolean
          description: 当前版本不提供用户级供应商硬额度，固定为 false
        allowed_models:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: '^[^/]{1,64}/[^/]{1,128}$'
          description: provider/model allowlist；空数组表示允许所有已登记模型
        daily_token_limit:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: 服务端已接收用量门禁；0 表示未配置
        quota_enforcement:
          type: string
          enum: [server_recorded_usage_guard]
          description: 说明额度只基于服务端已接收记录，不代表供应商权威账单
        as_of:
          $ref: '#/components/schemas/Timestamp'
    DeviceSummary:
      type: object
      additionalProperties: false
      required: [id, user_id, product, device_name, platform, app_version, status, online, last_seen_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        user_id:
          $ref: '#/components/schemas/Id'
        product:
          $ref: '#/components/schemas/ProductCode'
        device_name:
          type: string
          maxLength: 128
        platform:
          type: string
          maxLength: 64
        app_version:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/DeviceStatus'
        online:
          type: boolean
          description: 服务端依据最后心跳和固定阈值派生的在线状态
        disk_free_bytes:
          type: integer
          minimum: 0
        memory_total_bytes:
          type: integer
          minimum: 0
        memory_available_bytes:
          type: integer
          minimum: 0
        cpu_logical_cores:
          type: integer
          minimum: 0
          maximum: 4096
        runtime_os_name:
          type: string
          maxLength: 128
        runtime_os_version:
          type: string
          maxLength: 128
        kernel_version:
          type: string
          maxLength: 128
        current_media_name:
          type: string
          maxLength: 255
        playback_state:
          type: string
          enum: [idle, playing, paused, error]
        last_seen_at:
          $ref: '#/components/schemas/Timestamp'
        activation_expires_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
          description: 当前设备绑定的账号授权到期时间；未绑定或历史数据缺失时省略
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, product]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 256
          description: 登录兼容既有 bcrypt 凭据；服务端不会因新密码策略拒绝仍有效的历史密码
          writeOnly: true
        product:
          $ref: '#/components/schemas/ProductCode'
    LoginResponse:
      type: object
      additionalProperties: false
      required: [request_id, tokens, user]
      properties:
        request_id:
          type: string
        tokens:
          $ref: '#/components/schemas/SessionTokens'
        user:
          $ref: '#/components/schemas/UserSummary'
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
    RefreshTokenResponse:
      type: object
      additionalProperties: false
      required: [request_id, tokens]
      properties:
        request_id:
          type: string
        tokens:
          $ref: '#/components/schemas/SessionTokens'
    LogoutRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      description: Refresh Token 用于定位当前会话；服务端只撤销该会话，重复或无效 Token 也返回幂等成功。
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
    LogoutResponse:
      type: object
      additionalProperties: false
      required: [request_id, success]
      properties:
        request_id:
          type: string
        success:
          type: boolean
          const: true
    ActivateDeviceRequest:
      type: object
      additionalProperties: false
      required: [device]
      properties:
        device:
          $ref: '#/components/schemas/DeviceRegistration'
    DeviceRegistration:
      type: object
      additionalProperties: false
      required: [product, device_id, device_name, platform, app_version]
      properties:
        product:
          $ref: '#/components/schemas/ProductCode'
        device_id:
          $ref: '#/components/schemas/Id'
        device_name:
          type: string
          maxLength: 128
        platform:
          type: string
          maxLength: 64
        app_version:
          type: string
          maxLength: 64
        os_version:
          type: string
          maxLength: 128
    ActivateDeviceResponse:
      type: object
      additionalProperties: false
      required: [request_id, device]
      properties:
        request_id:
          type: string
        device:
          $ref: '#/components/schemas/DeviceSummary'
    HeartbeatRequest:
      type: object
      additionalProperties: false
      required: [product, device_id, sent_at, status]
      properties:
        product:
          $ref: '#/components/schemas/ProductCode'
        device_id:
          $ref: '#/components/schemas/Id'
        sent_at:
          $ref: '#/components/schemas/Timestamp'
        status:
          type: object
          additionalProperties: false
          required: [disk_free_bytes]
          properties:
            disk_free_bytes:
              type: integer
              minimum: 0
            memory_total_bytes:
              type: integer
              minimum: 0
            memory_available_bytes:
              type: integer
              minimum: 0
            cpu_logical_cores:
              type: integer
              minimum: 0
              maximum: 4096
            os_name:
              type: string
              maxLength: 128
            os_version:
              type: string
              maxLength: 128
            kernel_version:
              type: string
              maxLength: 128
            current_media_name:
              type: string
              maxLength: 255
            playback_state:
              type: string
              enum: [idle, playing, paused, error]
    HeartbeatResponse:
      type: object
      additionalProperties: false
      required: [request_id, accepted_at, device_status]
      properties:
        request_id:
          type: string
        accepted_at:
          $ref: '#/components/schemas/Timestamp'
        device_status:
          $ref: '#/components/schemas/DeviceStatus'
    ClientProfileResponse:
      type: object
      additionalProperties: false
      required: [request_id, product, user, device, permissions]
      properties:
        request_id:
          type: string
        product:
          $ref: '#/components/schemas/ProductCode'
        user:
          $ref: '#/components/schemas/UserSummary'
        device:
          $ref: '#/components/schemas/DeviceSummary'
        permissions:
          type: array
          items:
            type: string
    ClientSyncId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    ClientSyncKind:
      type: string
      enum: [persona_version, policy_version, model_config, knowledge_source, knowledge_document, knowledge_chunk, knowledge_rule, memory]
    ClientSyncMutation:
      type: object
      additionalProperties: false
      required: [mutation_id, kind, item_id, base_revision, deleted]
      properties:
        mutation_id:
          $ref: '#/components/schemas/ClientSyncId'
        kind:
          $ref: '#/components/schemas/ClientSyncKind'
        item_id:
          $ref: '#/components/schemas/ClientSyncId'
          description: 模型配置与人设/策略版本使用固定语义标识；知识项和记忆使用稳定业务标识。
        base_revision:
          type: integer
          format: int64
          minimum: 0
        deleted:
          type: boolean
        payload:
          $ref: '#/components/schemas/ClientSyncPayload'
          description: 服务端按 kind 精确匹配 schema；单项序列化后最多 256 KiB，并递归拒绝秘密键。删除墓碑必须省略。
      allOf:
        - if:
            properties:
              deleted:
                const: false
          then:
            required: [payload]
        - if:
            properties:
              deleted:
                const: true
          then:
            not:
              required: [payload]
    ClientSyncWriteRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ClientSyncMutation'
    ClientSyncItem:
      type: object
      additionalProperties: false
      required: [kind, item_id, revision, deleted, updated_by_device_id, updated_at]
      properties:
        kind:
          $ref: '#/components/schemas/ClientSyncKind'
        item_id:
