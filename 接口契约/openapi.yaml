openapi: 3.1.0
info:
  title: AutoLive Phase 0 接口契约
  version: 0.1.0
  summary: Go 控制面、React 管理端、Rust/Tauri 客户端共享的 `/api/v1` OpenAPI 契约
  description: |
    本契约只覆盖控制面元数据、授权、设备、模型账号测试、直连模型租约和调用摘要。
    不上传大视频文件，不返回完整模型密钥；媒体处理、ASR/TTS、实时音频候选和播放均在桌面端本地完成，Rust 使用单账号短期租约直接调用 OpenAI-compatible 供应商。
    当前首版导入单个视频后只在桌面端单窗口循环播放；视频处理、声音处理和实时音频幻化不创建媒体任务。
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: https://api.example.com
    description: 示例服务地址
tags:
  - name: Auth
  - name: Client
  - name: Model Leases
  - name: Model Accounts
  - name: Admin
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 管理端登录
      description: |
        保留的管理端登录入口，成功后只签发 `audience=admin` 会话。
        桌面客户端必须使用 `/api/v1/client/auth/login`，不得复用本入口获取管理会话。
        账号不存在、密码错误、用户禁用或缺少目标产品成员关系对外统一返回 `401 UNAUTHENTICATED`。
      operationId: authLogin
      parameters:
        - $ref: '#/components/parameters/LegacyClientCompatibilityHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功；`tokens.audience` 固定为 `admin`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/client/auth/login:
    post:
      tags: [Client, Auth]
      summary: 桌面端登录
      description: |
        桌面端专用登录入口，成功后只签发 `audience=desktop` 会话。
        管理员账号、不存在的账号、密码错误、用户禁用或缺少目标产品成员关系对外统一返回 `401 UNAUTHENTICATED`，不泄露账号是否存在或角色。
      operationId: clientAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功；`tokens.audience` 固定为 `desktop`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: 刷新会话
      description: |
        单次轮换 Refresh Token，新会话必须继承原会话的用户、产品、设备和 `audience`，客户端不能借刷新切换权限面。
        已轮换的 Refresh Token 被再次使用时，服务端撤销同一 token family 的全部会话，对外统一返回 `401 REFRESH_TOKEN_INVALID`。
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 刷新成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: 退出登录
      description: |
        以 Refresh Token 定位并撤销对应会话，不要求 Access Token 仍有效。
        相同、已轮换、已撤销、已过期或未知 Refresh Token 的重复退出均返回同样的 `200` 成功响应，不泄露 Token 状态。
      operationId: authLogout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: 已退出
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/client/activate:
    post:
      tags: [Client]
      summary: 按账号授权绑定当前设备
      description: 桌面端账号密码登录成功后自动调用；服务端按登录账号的有效激活授权和设备额度完成绑定，客户端不提交激活码明文。
      operationId: clientActivate
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateDeviceRequest'
      responses:
        '200':
          description: 当前设备已按账号授权绑定成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateDeviceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/client/heartbeat:
    post:
      tags: [Client]
      summary: 上报设备心跳
      operationId: clientHeartbeat
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: 心跳已接收
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/client/profile:
    get:
      tags: [Client]
      summary: 获取客户端当前用户、设备和权限摘要
      operationId: clientProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前身份摘要
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/client/sync/items:
    get:
      tags: [Client]
      summary: 按全局 revision 增量读取 douyin-desktop 用户资产
      description: 作用域只来自已认证的 desktop 会话及其有效设备绑定；仅支持 product=douyin_desktop。
      operationId: listClientSyncItems
      security:
        - bearerAuth: []
      parameters:
        - name: after_revision
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        '200':
          description: 按 revision 升序返回当前事实或删除墓碑
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSyncPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Client]
      summary: 使用 CAS 与 mutation 幂等写入 douyin-desktop 用户资产
      description: |
        每项使用自带 mutation_id 保证幂等；请求体不得提交 user、product 或 device 作用域。
        新建项 base_revision=0；更新或删除必须等于当前 revision。批内任一冲突时整批不提交。
        model_config 的 item_id 固定为 global-model-config；persona_version / policy_version
        分别使用 global-persona-v{version} / global-policy-v{version}，且版本必须与 payload 一致。
        知识项必须按来源、文档、分块/规则的父子顺序写入；规则只能引用同一文档的活动分块。
        删除父项前必须先按规则、分块、文档、来源的顺序删除活动子项。
      operationId: writeClientSyncItems
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientSyncWriteRequest'
      responses:
        '200':
          description: 写入已提交，或按相同 mutation_id 返回原回执
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSyncWriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/client/model-leases:
    post:
      tags: [Model Leases]
      summary: 申请模型租约
      operationId: createModelLease
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelLeaseRequest'
      responses:
        '200':
          description: 已返回可用租约
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelLeaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/client/model-leases/{lease_id}/renew:
    post:
      tags: [Model Leases]
      summary: 续租模型租约
      operationId: renewModelLease
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewModelLeaseRequest'
      responses:
        '200':
          description: 续租成功或幂等返回当前租约
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelLeaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/client/model-leases/{lease_id}/release:
    post:
      tags: [Model Leases]
      summary: 释放模型租约
      operationId: releaseModelLease
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LeaseId'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseModelLeaseRequest'
      responses:
        '200':
          description: 已释放或重复释放
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseModelLeaseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/client/llm/call-records:
    post:
      tags: [Model Accounts]
      summary: 记录 Rust 直连模型调用摘要
      description: |
        Rust 使用当前 `direct_lease` 直接调用租约指定的 OpenAI-compatible 供应商；Go 不接收话术正文、视频或完整音频文件。
        本接口只记录 client_call_id、lease_id、provider/model、usage、延迟、状态和错误摘要；Go 生成服务端 request_id，客户端上报的 usage 必须标记为 `client_reported`。
      operationId: recordDirectLLMCall
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectLLMCallRecordRequest'
      responses:
        '200':
          description: 调用摘要已记录；模型正文不经 Go 返回
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectLLMCallRecordResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/auth/change-password:
    post:
      tags: [Admin]
      summary: 修改本地管理员密码
      description: 仅本地管理员可调用；成功后撤销该管理员的所有会话，响应不返回密码。
      operationId: changeLocalAdminPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeLocalAdminPasswordRequest'
      responses:
        '200':
          description: 密码已修改并撤销管理员会话
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: 查询用户列表
      operationId: listAdminUsers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AdminProduct'
      responses:
        '200':
          description: 用户分页列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Admin]
      summary: 创建用户
      description: 仅内建本地管理员可调用；创建全局用户身份。
      operationId: createAdminUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 创建成功
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '408':
          $ref: '#/components/responses/RequestTimeout'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/admin/users/{user_id}/devices:
    get:
      tags: [Admin]
      summary: 查询用户设备
      operationId: listAdminUserDevices
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AdminProduct'
      responses:
        '200':
          description: 用户设备分页列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '400':
