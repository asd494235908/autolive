      properties:
        id:
          $ref: '#/components/schemas/Id'
        lease_id:
          $ref: '#/components/schemas/Id'
        request_id:
          $ref: '#/components/schemas/Id'
        client_call_id:
          $ref: '#/components/schemas/Id'
        provider:
          type: string
        model:
          type: string
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
        latency_ms:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [succeeded, failed, timeout, cancelled, unknown]
        usage_source:
          type: string
          enum: [client_reported]
        error_code:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'
    ModelUsageListResponse:
      type: object
      additionalProperties: false
      required: [request_id, items, pagination]
      properties:
        request_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ModelUsageRecord'
        pagination:
          $ref: '#/components/schemas/Pagination'
    AuditLog:
      type: object
      additionalProperties: false
      required: [id, action, target_type, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        actor_user_id:
          type:
            - string
            - 'null'
        device_id:
          type:
            - string
            - 'null'
        action:
          type: string
        target_type:
          type: string
        target_id:
          type:
            - string
            - 'null'
        request_id:
          type:
            - string
            - 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
    AuditLogListResponse:
      type: object
      additionalProperties: false
      required: [request_id, items, pagination]
      properties:
        request_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        pagination:
          $ref: '#/components/schemas/Pagination'
    HealthResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, service, version, now]
      properties:
        request_id:
          type: string
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        version:
          type: string
        now:
          $ref: '#/components/schemas/Timestamp'
