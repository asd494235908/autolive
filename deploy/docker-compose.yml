name: autolive

x-app-environment: &app-environment
  APP_ADDR: ${APP_ADDR}
  APP_VERSION: ${APP_VERSION}
  APP_STORAGE_MODE: ${APP_STORAGE_MODE}
  APP_MODEL_READ_SOURCE: ${APP_MODEL_READ_SOURCE}
  APP_DATABASE_URL: ${APP_DATABASE_URL}
  APP_SECRET_ENCRYPTION_KEY: ${APP_SECRET_ENCRYPTION_KEY}
  APP_AUTH_THROTTLE_HMAC_KEY: ${APP_AUTH_THROTTLE_HMAC_KEY}
  APP_TRUSTED_PROXY_CIDRS: ${APP_TRUSTED_PROXY_CIDRS}
  APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME}
  APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
  APP_DEPLOYMENT_ENV: ${APP_DEPLOYMENT_ENV}
  APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
  APP_ALLOW_INSECURE_HTTP: ${APP_ALLOW_INSECURE_HTTP}
  APP_REQUEST_TIMEOUT: ${APP_REQUEST_TIMEOUT}
  APP_SHUTDOWN_TIMEOUT: ${APP_SHUTDOWN_TIMEOUT}
  APP_MODEL_HEALTH_PROBE_INTERVAL: ${APP_MODEL_HEALTH_PROBE_INTERVAL}
  APP_MODEL_HEALTH_PROBE_TIMEOUT: ${APP_MODEL_HEALTH_PROBE_TIMEOUT}
  APP_MODEL_HEALTH_PROBE_MAX_CONCURRENT: ${APP_MODEL_HEALTH_PROBE_MAX_CONCURRENT}
  APP_MODEL_HEALTH_PROBE_MAX_ACCOUNTS: ${APP_MODEL_HEALTH_PROBE_MAX_ACCOUNTS}
  APP_MODEL_HEALTH_PROBE_BACKOFF_BASE: ${APP_MODEL_HEALTH_PROBE_BACKOFF_BASE}
  APP_MODEL_HEALTH_PROBE_BACKOFF_MAX: ${APP_MODEL_HEALTH_PROBE_BACKOFF_MAX}
  APP_RETENTION_CLEANUP_INTERVAL: ${APP_RETENTION_CLEANUP_INTERVAL}
  APP_RETENTION_CLEANUP_TIMEOUT: ${APP_RETENTION_CLEANUP_TIMEOUT}
  APP_RETENTION_CLEANUP_BATCH: ${APP_RETENTION_CLEANUP_BATCH}
  APP_AUTH_SESSION_RETENTION_TTL: ${APP_AUTH_SESSION_RETENTION_TTL}
  APP_AUTH_THROTTLE_RETENTION_TTL: ${APP_AUTH_THROTTLE_RETENTION_TTL}
  APP_IDEMPOTENCY_RETENTION_TTL: ${APP_IDEMPOTENCY_RETENTION_TTL}
  APP_MODEL_TEST_RETENTION_TTL: ${APP_MODEL_TEST_RETENTION_TTL}
  APP_AUDIT_LOG_RETENTION_TTL: ${APP_AUDIT_LOG_RETENTION_TTL}

x-migrate-environment: &migrate-environment
  APP_STORAGE_MODE: ${APP_STORAGE_MODE}
  APP_MODEL_READ_SOURCE: ${APP_MODEL_READ_SOURCE}
  APP_DATABASE_URL: ${APP_DATABASE_URL}
  APP_MIGRATION_TIMEOUT: ${APP_MIGRATION_TIMEOUT}
  APP_MIGRATION_METRICS_FILE: ${APP_MIGRATION_METRICS_FILE}

services:
  autolive-migrate:
    image: ${AUTOLIVE_API_IMAGE}
    environment: *migrate-environment
    command: ["/usr/local/bin/autolive-migrate"]
    restart: "on-failure:5"
    stop_grace_period: ${AUTOLIVE_STOP_GRACE_PERIOD:-60s}
    networks:
      - shared-net

  autolive-api:
    image: ${AUTOLIVE_API_IMAGE}
    environment: *app-environment
    depends_on:
      autolive-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: ${AUTOLIVE_STOP_GRACE_PERIOD:-60s}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/v1/readyz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shared-net

  autolive-admin:
    image: ${AUTOLIVE_ADMIN_IMAGE}
    depends_on:
      autolive-api:
        condition: service_healthy
    ports:
      # Keep the API/admin HTTP hop on loopback. Public traffic must terminate
      # TLS at deploy/reverse-proxy/nginx.conf and then reach this port.
      - "${AUTOLIVE_ADMIN_HTTP_BIND:-127.0.0.1}:18090:80"
    restart: unless-stopped
    stop_grace_period: ${AUTOLIVE_STOP_GRACE_PERIOD:-60s}
    networks:
      - shared-net

networks:
  shared-net:
    external: true
    name: shared-net
